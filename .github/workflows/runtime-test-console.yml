name: Build runtime test console

on:
  workflow_dispatch:
  push:
    branches:
      - research/runtime-test-console
    paths:
      - 'research/RuntimeTestConsole/**'
      - '.github/workflows/runtime-test-console.yml'

permissions:
  contents: read

concurrency:
  group: keepersalerts-runtime-test-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore research/RuntimeTestConsole/KeepersAlerts.RuntimeTestConsole.csproj

      - name: Build
        run: dotnet build research/RuntimeTestConsole/KeepersAlerts.RuntimeTestConsole.csproj -c Release --no-restore

      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='KeepersAlerts.RuntimeTestConsole.0.1.1.dll'
          cp 'bin/RuntimeTestConsole/KeepersAlerts.RuntimeTestConsole.dll' "dist/$asset"
          size=$(stat -c%s "dist/$asset")
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "Runtime Test Console 0.1.1 size: $size"
          echo "Runtime Test Console 0.1.1 SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepersAlerts-RuntimeTestConsole-0.1.1
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 14
