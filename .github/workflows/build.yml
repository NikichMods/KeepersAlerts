name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'KeepersAlerts.csproj'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'KeepersAlerts.csproj'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: keepersalerts-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeepersAlerts.csproj

      - name: Build
        run: dotnet build KeepersAlerts.csproj -c Release --no-restore
