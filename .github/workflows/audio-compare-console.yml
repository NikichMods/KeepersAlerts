name: Build audio compare console

on:
  workflow_dispatch:
  push:
    branches:
      - research/audio-compare-console
    paths:
      - 'research/AudioCompareConsole/**'
      - '.github/workflows/audio-compare-console.yml'

permissions:
  contents: read

concurrency:
  group: keepersalerts-audio-compare-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore research/AudioCompareConsole/KeepersAlerts.AudioCompareConsole.csproj

      - name: Build
        run: dotnet build research/AudioCompareConsole/KeepersAlerts.AudioCompareConsole.csproj -c Release --no-restore

      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='KeepersAlerts.AudioCompareConsole.0.1.0.dll'
          cp 'bin/AudioCompareConsole/KeepersAlerts.AudioCompareConsole.dll' "dist/$asset"
          size=$(stat -c%s "dist/$asset")
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "Audio Compare Console 0.1.0 size: $size"
          echo "Audio Compare Console 0.1.0 SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepersAlerts-AudioCompareConsole-0.1.0
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 14
