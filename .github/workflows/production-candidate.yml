name: Build production candidate

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/0.1.2
    paths:
      - 'src/**'
      - 'KeepersAlerts.csproj'
      - '.github/workflows/production-candidate.yml'

permissions:
  contents: read

concurrency:
  group: keepersalerts-production-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeepersAlerts.csproj

      - name: Build
        run: dotnet build KeepersAlerts.csproj -c Release --no-restore

      - name: Stage immutable candidate
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='KeepersAlerts.0.1.2.dll'
          cp 'bin/ReleasePlugin/KeepersAlerts.dll' "dist/$asset"
          size=$(stat -c%s "dist/$asset")
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "KeepersAlerts 0.1.2 size: $size"
          echo "KeepersAlerts 0.1.2 SHA-256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepersAlerts-0.1.2
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 14
